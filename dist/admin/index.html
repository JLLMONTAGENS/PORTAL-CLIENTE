<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retaguarda | JLL Montagens</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body>
<main class="admin-shell">
  <section id="login-view" class="login-card">
    <div class="brand">JLL <span>MONTAGENS</span></div><h1>Retaguarda de atendimento</h1><p>Entre para acompanhar os clientes e organizar os serviços.</p>
    <form id="login-form"><label>E-mail<input name="email" type="email" value="jjmelo-g@hotmail.com" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button><p id="login-error" class="error" role="alert"></p></form>
  </section>
  <section id="dashboard-view" hidden>
    <header class="topbar"><div><div class="brand">JLL <span>MONTAGENS</span></div><h1>Painel de atendimentos</h1></div><button id="logout" class="ghost">Sair</button></header>
    <div class="toolbar"><div class="filters" role="tablist"><button class="filter active" data-status="">Todos</button><button class="filter" data-status="PENDENTE">Pendentes</button><button class="filter" data-status="GEROU_ORCAMENTO">Orçamento gerado</button><button class="filter" data-status="ATRIBUIDO_MONTADOR">Atribuídos</button><button class="filter" data-status="SERVICO_FINALIZADO">Finalizados</button></div><button id="refresh" class="refresh">Atualizar</button></div>
    <div id="summary" class="summary"></div><div id="list" class="attendance-list"></div><p id="dashboard-error" class="error" role="alert"></p>
  </section>
</main><script src="/admin/admin.js"></script>
</body></html>
