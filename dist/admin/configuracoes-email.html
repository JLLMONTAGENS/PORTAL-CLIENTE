<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Configurações de E-mail | JLL</title><link rel="stylesheet" href="/admin/montadores.css"><link rel="stylesheet" href="/admin/erp-sidebar.css"></head><body class="erp-secondary-page"><header class="erp-secondary-nav"><a href="/admin/"><img src="/assets/brand/jll-horizontal-reverse.svg" alt="JLL Montagens"></a><div><a href="/admin/">Central</a><a href="/admin/montadores.html">Cadastro de Montadores</a><a href="/admin/pagamentos-montadores.html">Pagamentos de Montadores</a><a class="active" href="/admin/configuracoes-email.html">Configurações de e-mail</a></div></header><main><section class="heading"><div><span>CONFIGURAÇÕES</span><h1>SMTP Locaweb</h1><p>A senha é criptografada no servidor e nunca retorna para o navegador.</p></div></section><section class="modal-card" style="margin-top:20px"><form id="smtp-form" class="detail-form"><div class="detail-grid"><label>Servidor SMTP<input name="host" value="email-ssl.com.br" required></label><label>Porta<input name="porta" type="number" value="465" required></label><label><span>Conexão</span><select name="seguro"><option value="true">SSL/TLS (segura)</option><option value="false">STARTTLS</option></select></label><label>Usuário<input name="usuario" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="new-password" placeholder="Deixe vazio para manter"></label><label>Nome do remetente<input name="remetenteNome" value="JLL Montagens" required></label><label>E-mail remetente<input name="remetenteEmail" type="email" required></label><label>Responder para<input name="responderPara" type="email"></label><label><span>Ativação</span><select name="ativo"><option value="false">Inativo</option><option value="true">Ativo</option></select></label></div><div><button type="submit">Salvar</button> <button id="test" class="secondary" type="button">Testar conexão</button></div><p id="smtp-message"></p></form></section></main><script src="/admin/configuracoes-email.js"></script></body></html>
